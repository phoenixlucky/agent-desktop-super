[package]
name      = "agent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
default = []
mcp-streamable-http = ["dep:axum", "dep:getrandom", "dep:rmcp", "dep:subtle", "dep:tokio"]

[dependencies]
agent-desktop-core.workspace = true
axum = { version = "0.8", optional = true }
getrandom = { version = "0.3", optional = true }
base64.workspace = true
clap.workspace               = true
serde.workspace              = true
serde_json.workspace         = true
thiserror.workspace          = true
tracing.workspace            = true
tracing-subscriber.workspace = true
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
subtle = { version = "2.6", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
agent-desktop-macos = { path = "../crates/macos" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
agent-desktop-windows = { path = "../crates/windows" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
agent-desktop-linux = { path = "../crates/linux" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "agent-desktop"
path = "main.rs"

[[test]]
name = "snapshot_test"
path = "tests/snapshot_test.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "cli_process"
path = "tests/cli_process.rs"

[[test]]
name = "cli_stdin"
path = "tests/cli_stdin.rs"

[[test]]
name = "mcp_process"
path = "tests/mcp_process.rs"

[[test]]
name = "mcp_http_process"
path = "tests/mcp_http_process.rs"

[[test]]
name = "command_host_absent"
path = "tests/command_host_absent.rs"

[[test]]
name = "windows_private_file_install"
path = "tests/windows_private_file_install.rs"

[[test]]
name = "windows_cursor_overlay_teardown"
path = "tests/windows_cursor_overlay_teardown.rs"

[lints]
workspace = true
